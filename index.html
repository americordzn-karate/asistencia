<style>

    Arial,

    width:100%;

    display:flex;

    flex-direction:column;

}


/* ================================
   ENCABEZADO
================================ */

.logo{

    width:120px;

    height:auto;

    margin-top:2px;

    margin-bottom:2px;

}

.titulo{

    font-size:22px;

    font-weight:bold;

    color:white;

    letter-spacing:2px;

    margin-bottom:5px;

}

.subtitulo{

    font-size:18px;

    color:#dddddd;

    margin-bottom:40px;

}
   /* ================================
   LOGO
================================ */

.logo{

    width:120px;

    height:auto;

    margin-bottom:10px;

}


/* ================================
   ESTADO DEL LECTOR
================================ */

#estado{

    font-size:32px;

    font-weight:bold;

    margin-top:20px;

}


/* ================================
   NOMBRE DEL ALUMNO
================================ */

    display:none;

    margin-top:40px;

}


/* ================================
   ICONO NFC
================================ */

.nfcIcon{

    font-size:110px;

    margin-top:30px;

    margin-bottom:20px;

}


/* Animación */

@keyframes senal{

    0%{

        transform:scale(.90);

        opacity:.35;

    }

    40%{

        transform:scale(1.15);

        opacity:1;

    }

        transform:scale(.90);

        opacity:.35;

    }

}


/* ================================
   COLORES DE MENSAJES
================================ */

.exito{

    color:#00ff66;

}


.error{

}

    color:#ffcc00;

}


/* ================================
   ALERTA DE PAGO PENDIENTE
================================ */

#overlayPago{

    display:none;

    position:fixed;

    top:0;

    width:100%;

    height:100%;

    background:#8b0000;

}

.pagoIcono{

}

.pagoTitulo{

}

.pagoNombre{

}

#btnEnterado{

}

#btnEnterado:active{

    transform:scale(0.97);

}

/* ================================
   VISTA DE CÁMARA PARA QR
   (vista pequeña, circular, discreta)
================================ */

#videoQR{

    display:none; /* se muestra solo cuando la cámara se activa con éxito */

    width:160px;

    height:160px;

    object-fit:cover;

}

#etiquetaQR{

}

/* ================================
   DISEÑO: ÍCONO NFC Y CÁMARA LADO A LADO
   (estas reglas van al final para ajustar tamaños
   sin modificar las reglas originales de arriba)
================================ */

#filaLectores{

    display:flex;

    justify-content:center;

}

#filaLectores .nfcIcon{

    font-size:70px;

}

#filaLectores #videoQR{

}

#etiquetaQR{

}

/* Foto del alumno en la pantalla de asistencia exitosa */

#fotoAlumno{

    display:none;

    width:150px;

    height:150px;

    object-fit:cover;

    border-radius:50%;

<body>


<div id="app">


    <img
    src="https://raw.githubusercontent.com/americordzn-karate/asistencia/main/Escudo%20Circulo%20PNG.png"
    class="logo"
    alt="Academia Senshi-Kan">

<div class="titulo">
    ACADEMIA SENSHI-KAN
</div>


    <div class="subtitulo">
        Control de asistencia
    </div>



    <!-- Fila que coloca el ícono NFC y la cámara uno al lado del otro -->
    <div id="filaLectores">

        <div id="iconoNFC" class="nfcIcon">
🛜
</div>

        <!-- Vista de la cámara frontal para lectura de QR -->
        <video id="videoQR" autoplay playsinline muted></video>

        <!-- Foto del alumno (solo visible cuando la asistencia se registra con éxito) -->
        <img id="fotoAlumno" alt="Foto del alumno">

    </div>

    <div id="etiquetaQR">Coloca tu código QR frente a la cámara</div>

<div id="estado" class="espera">
Acerca tu tarjeta o muestra tu QR
</div>

<button id="btnActivarNFC"
        style="display:none;
               margin-top:25px;
               padding:16px 35px;
               font-size:24px;
               font-weight:bold;
               border:none;
               border-radius:10px;
               background:#00b140;
               color:white;
               cursor:pointer;">
    ACTIVAR LECTOR NFC
</button>

    <div id="nombreAlumno">

    </div>

    <!-- Lienzo oculto usado solo para procesar la imagen, nunca se muestra -->
    <canvas id="canvasQR" style="display:none;"></canvas>



</div>


<!-- ================================
     OVERLAY: ALERTA DE PAGO PENDIENTE
================================ -->

<div id="overlayPago">

    <div class="pagoIcono">⚠️</div>

    <div class="pagoTitulo">PAGO PENDIENTE</div>

    <div class="pagoNombre" id="nombrePagoPendiente"></div>

    <button id="btnEnterado" onclick="confirmarPagoPendiente()">ENTERADO</button>

</div>



<script>


/*
==================================================
CONFIGURACIÓN DEL SISTEMA
==================================================
*/


// URL del Web App de Google Apps Script

const URL_SCRIPT = 
"https://script.google.com/macros/s/AKfycbwX5w8iiwkJVbGtpz-5f20U9jue2MC0vouE3blkHXo9CIMqg9bvCZrAYE8WKxH4gXGWzg/exec";



// Control para evitar múltiples lecturas

const estado = document.getElementById("estado");
   const btnActivarNFC = document.getElementById("btnActivarNFC");
const nombreAlumno = document.getElementById("nombreAlumno");
   const iconoNFC = document.getElementById("iconoNFC");
const overlayPago = document.getElementById("overlayPago");
const nombrePagoPendiente = document.getElementById("nombrePagoPendiente");

let bloqueado = false;
let ndef = null;
   let wakeLock = null;
let ultimoIdAlumno = null;



/*
==================================================
INICIO DEL SISTEMA
==================================================
*/


document.addEventListener("DOMContentLoaded", async ()=>{

    await activarWakeLock();

    try{

        await iniciarNFC();

    }catch(error){

        if(error.name==="NotAllowedError"){

            estado.innerHTML="Pulsa el botón para activar NFC";
            btnActivarNFC.style.display="inline-block";

        }else{

            throw error;

        }

    }

    // Iniciar el lector de códigos QR (cámara frontal).
    // Si la cámara no está disponible o el usuario la rechaza,
    // el sistema sigue funcionando normalmente solo con NFC.
    await iniciarQR();

});
console.log("JavaScript cargado correctamente");


/*
==================================================
LECTOR NFC
==================================================
*/

   /*
==================================================
MANTENER PANTALLA ENCENDIDA
==================================================
*/

async function activarWakeLock(){

    try{

        if("wakeLock" in navigator){

            wakeLock = await navigator.wakeLock.request("screen");

            console.log("Wake Lock activado");

            wakeLock.addEventListener("release",()=>{

                console.log("Wake Lock liberado");

            });

        }

    }
    catch(err){

        console.log("Wake Lock no disponible:",err);

    }

}

async function iniciarNFC(){

    if(!("NDEFReader" in window)){
        estado.className="error";
        estado.innerHTML="Este dispositivo no soporta Web NFC";
        return;
    }

    ndef = new NDEFReader();

    await ndef.scan();   // <-- si falla, deja que lance la excepción

    estado.className="espera";
    estado.innerHTML="📲 Acerca tu tarjeta o muestra tu QR";

    btnActivarNFC.style.display="none";

    ndef.onreading = leerTarjeta;
}

/*
==================================================
PROCESAR INFORMACIÓN DE LA TARJETA
==================================================
*/


function leerTarjeta(evento){



    // Evitar lecturas repetidas

    if(bloqueado){

        return;

    }



    bloqueado=true;



    let contenido="";



    const decoder =
    new TextDecoder();



    for(const record of evento.message.records){



        if(record.recordType==="text"){


            contenido =
            decoder.decode(record.data);


        }


    }



    console.log("ID recibido:",contenido);

if(contenido!=""){

    reproducirSonidoDeteccion();

    procesarIDAlumno(contenido, false);

}
    else{


        mostrarError(
        "Tarjeta sin información"
        );


        // Cooldown estándar antes de aceptar otra tarjeta

        programarDesbloqueo(5000);


    }



}



/*
==================================================
LECTOR DE CÓDIGOS QR (CÁMARA FRONTAL)
==================================================
Este bloque activa la cámara frontal del teléfono y revisa
la imagen varias veces por segundo buscando un código QR.
Cuando encuentra uno, reutiliza exactamente el mismo proceso
de registro que ya usa el NFC (procesarIDAlumno), por lo que
toda la lógica de pagos pendientes, duplicados, sonidos y
mensajes funciona igual para ambos métodos.
==================================================
*/

const videoQR = document.getElementById("videoQR");
const etiquetaQR = document.getElementById("etiquetaQR");
const canvasQR = document.getElementById("canvasQR");
const contextoQR = canvasQR.getContext("2d", { willReadFrequently: true });

let escaneando = false;
let ultimoQRLeido = "";
let tiempoUltimoQR = 0;

async function iniciarQR(){

    // Si el navegador no soporta acceso a cámara, se omite sin romper nada
    if(!("mediaDevices" in navigator) || !("getUserMedia" in navigator.mediaDevices)){

        console.log("Este dispositivo no soporta lectura de cámara para QR");
        return;

    }

    try{

        const stream = await navigator.mediaDevices.getUserMedia({

            video: { facingMode: "user" }, // cámara frontal
            audio: false

        });

        videoQR.srcObject = stream;

        await videoQR.play();

        videoQR.style.display = "block";
        etiquetaQR.style.display = "block";

        escaneando = true;

        requestAnimationFrame(escanearQR);

    }catch(error){

        // Si el usuario no da permiso de cámara, o no hay cámara disponible,
        // el sistema NFC sigue funcionando con total normalidad.
        console.log("Cámara no disponible para QR:", error);

    }

}

function escanearQR(){

    if(!escaneando){
        return;
    }

    if(videoQR.readyState === videoQR.HAVE_ENOUGH_DATA){

        canvasQR.width = videoQR.videoWidth;
        canvasQR.height = videoQR.videoHeight;

        contextoQR.drawImage(videoQR, 0, 0, canvasQR.width, canvasQR.height);

        const imageData = contextoQR.getImageData(0, 0, canvasQR.width, canvasQR.height);

        const resultado = jsQR(imageData.data, imageData.width, imageData.height);

        if(resultado && resultado.data && !bloqueado){

            const ahora = Date.now();

            // Evita procesar el mismo QR varias veces seguidas en menos de 4 segundos
            if(resultado.data !== ultimoQRLeido || (ahora - tiempoUltimoQR) > 4000){

                ultimoQRLeido = resultado.data;
                tiempoUltimoQR = ahora;

                bloqueado = true;

                reproducirSonidoDeteccion();

                procesarIDAlumno(resultado.data, false);

            }

        }

    }

    requestAnimationFrame(escanearQR);

}




/*
==================================================
POR AHORA SOLO MOSTRAMOS EL ID RECIBIDO
==================================================
*/


/*
==================================================
ENVIAR ID AL APPS SCRIPT
==================================================
*/


async function procesarIDAlumno(id, confirmado){


    ultimoIdAlumno = id;

    // Pide la foto en paralelo, sin retrasar el registro de asistencia
    if(id !== idPromesaFoto){ solicitarFoto(id); }


    estado.className="espera";


    iconoNFC.style.display="none";

videoQR.style.display="none";
etiquetaQR.style.display="none";

nombreAlumno.style.display="none";

estado.className="espera";

estado.innerHTML="Verificando...";



    try{


        const respuesta = await fetch(URL_SCRIPT,{

    method:"POST",

    headers:{
        "Content-Type":"text/plain;charset=utf-8"
    },

    body:JSON.stringify({

        accion:"registrarAsistencia",

        idAlumno:id,

        confirmado:confirmado===true

    })

});
    
 

        const textoRespuesta = await respuesta.text();

console.log("Respuesta servidor:", textoRespuesta);

const datos = JSON.parse(textoRespuesta);



        console.log(datos);



        mostrarResultado(datos);



    }


    catch(error){

    console.error(error);

    estado.className="error";

    estado.innerHTML=error.message;

    nombreAlumno.style.display="block";

    nombreAlumno.innerHTML=error.stack || "";

    // Cooldown estándar antes de aceptar otra tarjeta

    programarDesbloqueo(5000);

}


}

   /*
==================================================
MOSTRAR RESULTADO DEL SERVIDOR
==================================================
*/


function mostrarResultado(datos){



    // --- CASO: PAGO PENDIENTE ---
    // El lector permanece bloqueado y no se registra asistencia
    // hasta que el usuario pulse el botón ENTERADO.

    if(!datos.success && datos.codigo==="PAGO_PENDIENTE"){

        mostrarAlertaPagoPendiente(datos.nombre);

        return;

    }



    nombreAlumno.style.display="block";



    if(datos.success){



        estado.className="exito";


        estado.innerHTML=
"✅ Asistencia registrada para:";



        nombreAlumno.innerHTML=
        datos.nombre;



       reproducirSonidoOK();

       mostrarFotoAlumno();



    }



    else if(datos.codigo==="DUPLICADO"){



        estado.className="error";


        estado.innerHTML=
"⚠ YA REGISTRÓ ASISTENCIA:";



        nombreAlumno.innerHTML=
        datos.nombre;



       reproducirSonidoError();



    }



    else{


        estado.className="error";


        estado.innerHTML=
        "❌ ALUMNO NO ENCONTRADO";



        nombreAlumno.innerHTML=
        "";



       reproducirSonidoError();


    }



    // Cooldown estándar de 5 segundos antes de aceptar otra tarjeta

    programarDesbloqueo(5000);



}



/*
==================================================
ALERTA DE PAGO PENDIENTE
==================================================
*/


function mostrarAlertaPagoPendiente(nombre){


    overlayPago.style.display="flex";


    nombrePagoPendiente.innerHTML = nombre || "";


    // Nota: "bloqueado" permanece en true. El lector NFC no
    // procesará nuevas tarjetas hasta que se pulse ENTERADO.


}


function confirmarPagoPendiente(){


    overlayPago.style.display="none";


    estado.className="espera";


    estado.innerHTML=
    "🔎 Verificando alumno...";


    // Se reenvía el mismo ID de alumno, ahora confirmado,
    // para registrar la asistencia y asignar los puntos.

    procesarIDAlumno(ultimoIdAlumno, true);


}



function volverEsperando(){

    iconoNFC.style.display="block";

    marcaFoto++;
    idPromesaFoto = null;
    fotoAlumno.style.display="none";
    fotoAlumno.removeAttribute("src");

    if(escaneando){

        videoQR.style.display="block";
        etiquetaQR.style.display="block";

    }

    nombreAlumno.style.display="none";

    estado.className="espera";

    estado.innerHTML="Acerca tu tarjeta o muestra tu QR";

}



function programarDesbloqueo(ms){


    setTimeout(()=>{


        bloqueado=false;


        volverEsperando();



    }, ms);


}





function mostrarError(texto){


    estado.className="error";


    estado.innerHTML=
    texto;


}
/*
==================================================
SONIDOS
==================================================
*/
function reproducirSonidoDeteccion(){

    const audio = new (window.AudioContext || window.webkitAudioContext)();

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = "triangle";

    osc.frequency.setValueAtTime(1800, audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(2400, audio.currentTime + 0.07);

    gain.gain.setValueAtTime(0.001, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.35, audio.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.10);

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime + 0.10);

}
   
function reproducirSonidoOK(){

    const audio = new (window.AudioContext || window.webkitAudioContext)();

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(880, audio.currentTime);
    osc.frequency.setValueAtTime(1175, audio.currentTime + 0.08);

    gain.gain.setValueAtTime(0.20, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.25);

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime + 0.25);

}



function reproducirSonidoError(){

    const audio = new (window.AudioContext || window.webkitAudioContext)();

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(250, audio.currentTime);

    gain.gain.setValueAtTime(0.20, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.40);

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime + 0.40);

}

   document.addEventListener("visibilitychange", async ()=>{

    if(document.visibilityState==="visible"){

        await activarWakeLock();

    }

});

   btnActivarNFC.addEventListener("click", async ()=>{

    try{

        await iniciarNFC();

    }catch(error){

        alert(error.name + "\n" + error.message);

    }

});

/*
==================================================
MANTENER EL SERVIDOR DESPIERTO
==================================================
Envía una petición ligera al abrir la página y cada 4 minutos
para evitar que Google "duerma" el script entre alumnos.
No afecta ninguna otra función.
*/
function calentarServidor(){
    fetch(URL_SCRIPT + "?accion=ping").catch(()=>{});
}
calentarServidor();
setInterval(calentarServidor, 4 * 60 * 1000);

/*
==================================================
FOTO DEL ALUMNO
==================================================
Al leer una tarjeta o QR, se pide la foto al servidor en paralelo
con el registro de asistencia. Solo se muestra cuando la asistencia
se registra con éxito, y se oculta al terminar el cooldown.
Si el alumno no tiene foto o no carga, todo sigue igual que antes.
*/

const fotoAlumno = document.getElementById("fotoAlumno");

let promesaFoto = null;
let idPromesaFoto = null;
let marcaFoto = 0;

function solicitarFoto(id){

    idPromesaFoto = id;

    promesaFoto = fetch(URL_SCRIPT,{

        method:"POST",

        headers:{ "Content-Type":"text/plain;charset=utf-8" },

        body:JSON.stringify({ accion:"fotoAlumno", idAlumno:id })

    })
    .then(r => r.json())
    .then(d => (d && d.success && d.foto) ? d.foto : null)
    .catch(() => null);

}

async function mostrarFotoAlumno(){

    const marca = ++marcaFoto;

    if(!promesaFoto) return;

    const fuente = await promesaFoto;

    // Solo se muestra si sigue vigente la misma pantalla de resultado
    if(fuente && marca === marcaFoto){

        fotoAlumno.src = fuente;
        fotoAlumno.style.display = "block";

    }

}
</script>
