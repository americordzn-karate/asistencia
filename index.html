<script>


/*
==================================================
CONFIGURACIÓN DEL SISTEMA
==================================================
*/


// URL del Web App de Google Apps Script

const URL_SCRIPT = 
"https://script.google.com/macros/s/AKfycbwX5w8iiwkJVbGtpz-5f20U9jue2MC0vouE3blkHXo9CIMqg9bvCZrAYE8WKxH4gXGWzg/exec";



// Control para evitar múltiples lecturas

const estado = document.getElementById("estado");
   const btnActivarNFC = document.getElementById("btnActivarNFC");
const nombreAlumno = document.getElementById("nombreAlumno");
   const iconoNFC = document.getElementById("iconoNFC");
const overlayPago = document.getElementById("overlayPago");
const nombrePagoPendiente = document.getElementById("nombrePagoPendiente");

let bloqueado = false;
let ndef = null;
let controladorNFC = null;
   let wakeLock = null;
let ultimoIdAlumno = null;



/*
==================================================
INICIO DEL SISTEMA
==================================================
*/


document.addEventListener("DOMContentLoaded", async ()=>{

    await activarWakeLock();

    try{

        // 1) Primero se activa el lector NFC para que Chrome tome el control
        await iniciarNFC();

    }catch(error){

        if(error.name==="NotAllowedError"){

            estado.innerHTML="Pulsa el botón para activar NFC";
            btnActivarNFC.style.display="inline-block";

        }else{

            console.error(error);

        }

    }finally{

        // 2) La cámara se enciende justo después de activar el NFC.
        //    Si la cámara no está disponible, el sistema sigue solo con NFC.
        iniciarQR();

    }

});
console.log("JavaScript cargado correctamente");


/*
==================================================
LECTOR NFC
==================================================
*/

   /*
==================================================
MANTENER PANTALLA ENCENDIDA
==================================================
*/

async function activarWakeLock(){

    try{

        if("wakeLock" in navigator){

            wakeLock = await navigator.wakeLock.request("screen");

            console.log("Wake Lock activado");

            wakeLock.addEventListener("release",()=>{

                console.log("Wake Lock liberado");

            });

        }

    }
    catch(err){

        console.log("Wake Lock no disponible:",err);

    }

}

async function iniciarNFC(){

    if(!("NDEFReader" in window)){
        estado.className="error";
        estado.innerHTML="Este dispositivo no soporta Web NFC";
        return;
    }

    ndef = new NDEFReader();

    controladorNFC = new AbortController();
    await ndef.scan({ signal: controladorNFC.signal });   // <-- si falla, deja que lance la excepción

    estado.className="espera";
    estado.innerHTML = (new URLSearchParams(window.location.search).get("modo")==="nfc")
        ? "📲 Acerca tu tarjeta ahora"
        : "📲 Acerca tu tarjeta o muestra tu QR";

    btnActivarNFC.style.display="none";

    ndef.onreading = leerTarjeta;
}

/*
==================================================
PROCESAR INFORMACIÓN DE LA TARJETA
==================================================
*/


function leerTarjeta(evento){



    // Evitar lecturas repetidas

    if(bloqueado){

        return;

    }



    bloqueado=true;



    let contenido="";



    const decoder =
    new TextDecoder();



    for(const record of evento.message.records){



        if(record.recordType==="text"){


            contenido =
            decoder.decode(record.data);


        }


    }



    console.log("ID recibido:",contenido);

if(contenido!=""){

    reproducirSonidoDeteccion();

    procesarIDAlumno(contenido, false);

}
    else{


        mostrarError(
        "Tarjeta sin información"
        );


        // Cooldown estándar antes de aceptar otra tarjeta

        programarDesbloqueo(3000);


    }



}



/*
==================================================
LECTOR DE CÓDIGOS QR (CÁMARA FRONTAL)
==================================================
Este bloque activa la cámara frontal del teléfono y revisa
la imagen varias veces por segundo buscando un código QR.
Cuando encuentra uno, reutiliza exactamente el mismo proceso
de registro que ya usa el NFC (procesarIDAlumno), por lo que
toda la lógica de pagos pendientes, duplicados, sonidos y
mensajes funciona igual para ambos métodos.
==================================================
*/

const videoQR = document.getElementById("videoQR");
const etiquetaQR = document.getElementById("etiquetaQR");
const canvasQR = document.getElementById("canvasQR");
const contextoQR = canvasQR.getContext("2d", { willReadFrequently: true });

let escaneando = false;
let ultimoQRLeido = "";
let tiempoUltimoQR = 0;
let ultimoEscaneo = 0;

let bucleQRActivo = false;
let iniciandoCamara = false;
let camaraSuspendida = false;   // true mientras se espera una tarjeta NFC
let temporizadorNFC = null;

async function iniciarQR(){

    // Si la dirección incluye ?camara=no, no se enciende la cámara (modo solo NFC)
    if(new URLSearchParams(window.location.search).get("camara")==="no" ||
       new URLSearchParams(window.location.search).get("modo")==="nfc"){
        return;
    }

    // Ya está encendida o en proceso de encenderse
    if(escaneando || iniciandoCamara || camaraSuspendida){
        return;
    }

    // Si el navegador no soporta acceso a cámara, se omite sin romper nada
    if(!("mediaDevices" in navigator) || !("getUserMedia" in navigator.mediaDevices)){

        console.log("Este dispositivo no soporta lectura de cámara para QR");
        return;

    }

    iniciandoCamara = true;

    try{

        const stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "user",                 // cámara frontal
                width:  { ideal: 640 },
                height: { ideal: 480 },
                frameRate: { ideal: 15, max: 20 }
            },
            audio: false

        });

        videoQR.srcObject = stream;

        await videoQR.play();

        videoQR.style.display = "block";
        etiquetaQR.style.display = "block";

        escaneando = true;

        if(!bucleQRActivo){
            bucleQRActivo = true;
            requestAnimationFrame(escanearQR);
        }

    }catch(error){

        // Si el usuario no da permiso de cámara, o no hay cámara disponible,
        // el sistema NFC sigue funcionando con total normalidad.
        console.log("Cámara no disponible para QR:", error);

    }

    iniciandoCamara = false;

}

// Apaga por completo la cámara (libera el hardware)
function detenerCamara(){

    escaneando = false;

    const flujo = videoQR.srcObject;

    if(flujo){
        flujo.getTracks().forEach(pista => pista.stop());
    }

    videoQR.srcObject = null;
    videoQR.style.display = "none";
    etiquetaQR.style.display = "none";

}

function escanearQR(){

    if(!escaneando){
        bucleQRActivo = false;
        return;
    }

    const ahoraFrame = Date.now();

    // Se analiza la imagen como máximo ~8 veces por segundo (menos carga al teléfono)
    if(videoQR.readyState === videoQR.HAVE_ENOUGH_DATA && (ahoraFrame - ultimoEscaneo) >= 120){

        ultimoEscaneo = ahoraFrame;

        canvasQR.width = videoQR.videoWidth;
        canvasQR.height = videoQR.videoHeight;

        contextoQR.drawImage(videoQR, 0, 0, canvasQR.width, canvasQR.height);

        const imageData = contextoQR.getImageData(0, 0, canvasQR.width, canvasQR.height);

        const resultado = jsQR(imageData.data, imageData.width, imageData.height);

        if(resultado && resultado.data && !bloqueado){

            const ahora = Date.now();

            // Evita procesar el mismo QR varias veces seguidas en menos de 4 segundos
            if(resultado.data !== ultimoQRLeido || (ahora - tiempoUltimoQR) > 4000){

                ultimoQRLeido = resultado.data;
                tiempoUltimoQR = ahora;

                bloqueado = true;

                reproducirSonidoDeteccion();

                procesarIDAlumno(resultado.data, false);

            }

        }

    }

    requestAnimationFrame(escanearQR);

}




/*
==================================================
POR AHORA SOLO MOSTRAMOS EL ID RECIBIDO
==================================================
*/


/*
==================================================
ENVIAR ID AL APPS SCRIPT
==================================================
*/


async function procesarIDAlumno(id, confirmado){


    ultimoIdAlumno = id;

    // Pide la foto en paralelo, sin retrasar el registro de asistencia
    if(id !== idPromesaFoto){ solicitarFoto(id); }


    estado.className="espera";


    iconoNFC.style.display="none";

videoQR.style.display="none";
etiquetaQR.style.display="none";

nombreAlumno.style.display="none";

estado.className="espera";

estado.innerHTML="Verificando...";



    try{


        const respuesta = await fetch(URL_SCRIPT,{

    method:"POST",

    headers:{
        "Content-Type":"text/plain;charset=utf-8"
    },

    body:JSON.stringify({

        accion:"registrarAsistencia",

        idAlumno:id,

        confirmado:confirmado===true

    })

});
    
 

        const textoRespuesta = await respuesta.text();

console.log("Respuesta servidor:", textoRespuesta);

const datos = JSON.parse(textoRespuesta);



        console.log(datos);



        mostrarResultado(datos);



    }


    catch(error){

    console.error(error);

    estado.className="error";

    estado.innerHTML=error.message;

    nombreAlumno.style.display="block";

    nombreAlumno.innerHTML=error.stack || "";

    // Cooldown estándar antes de aceptar otra tarjeta

    programarDesbloqueo(3000);

}


}

   /*
==================================================
MOSTRAR RESULTADO DEL SERVIDOR
==================================================
*/


function mostrarResultado(datos, omitirCumple){

    // --- CASO: CUMPLEAÑOS ---
    // La asistencia ya quedó registrada en el servidor. Se muestra primero el
    // mensaje y, al cerrarse, la pantalla normal de asistencia registrada.

    if(datos.success && datos.cumple && !omitirCumple){

        mostrarCumple(datos);

        return;

    }




    // --- CASO: PAGO PENDIENTE ---
    // El lector permanece bloqueado y no se registra asistencia
    // hasta que el usuario pulse el botón ENTERADO.

    if(!datos.success && datos.codigo==="PAGO_PENDIENTE"){

        mostrarAlertaPagoPendiente(datos.nombre);

        return;

    }



    nombreAlumno.style.display="block";



    if(datos.success){



        estado.className="exito";


        estado.innerHTML=
"✅ Asistencia registrada para:";



        nombreAlumno.innerHTML=
        datos.nombre;



       reproducirSonidoOK();

       mostrarFotoAlumno();



    }



    else if(datos.codigo==="DUPLICADO"){



        estado.className="error";


        estado.innerHTML=
"⚠ YA REGISTRÓ ASISTENCIA:";



        nombreAlumno.innerHTML=
        datos.nombre;



       reproducirSonidoError();



    }



    else{


        estado.className="error";


        estado.innerHTML=
        "❌ ALUMNO NO ENCONTRADO";



        nombreAlumno.innerHTML=
        "";



       reproducirSonidoError();


    }



    // Cooldown estándar de 5 segundos antes de aceptar otra tarjeta

    programarDesbloqueo(3000);



}



/*
==================================================
ALERTA DE PAGO PENDIENTE
==================================================
*/


function mostrarAlertaPagoPendiente(nombre){


    overlayPago.style.display="flex";


    nombrePagoPendiente.innerHTML = nombre || "";


    // Nota: "bloqueado" permanece en true. El lector NFC no
    // procesará nuevas tarjetas hasta que se pulse ENTERADO.


}


function confirmarPagoPendiente(){


    overlayPago.style.display="none";


    estado.className="espera";


    estado.innerHTML=
    "🔎 Verificando alumno...";


    // Se reenvía el mismo ID de alumno, ahora confirmado,
    // para registrar la asistencia y asignar los puntos.

    procesarIDAlumno(ultimoIdAlumno, true);


}



function volverEsperando(){

    iconoNFC.style.display="block";

    marcaFoto++;
    salirModoNFC();
    idPromesaFoto = null;
    fotoAlumno.style.display="none";
         document.body.classList.remove("conFoto");
    fotoAlumno.removeAttribute("src");

    if(escaneando){

        videoQR.style.display="block";
        etiquetaQR.style.display="block";

    }

    nombreAlumno.style.display="none";

    estado.className="espera";

    estado.innerHTML="Acerca tu tarjeta o muestra tu QR";

}



function programarDesbloqueo(ms){


    setTimeout(()=>{


        bloqueado=false;


        volverEsperando();



    }, ms);


}





function mostrarError(texto){


    estado.className="error";


    estado.innerHTML=
    texto;


}
/*
==================================================
SONIDOS
==================================================
*/
function reproducirSonidoDeteccion(){

    const audio = new (window.AudioContext || window.webkitAudioContext)();

    const osc = audio.createOscillator();
    const gain = audio.createGain();

        osc.type = "square";

    osc.frequency.setValueAtTime(1800, audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(2400, audio.currentTime + 0.07);

    gain.gain.setValueAtTime(0.001, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(1.0, audio.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.10);

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime + 0.10);

}
   
function reproducirSonidoOK(){

    const audio = new (window.AudioContext || window.webkitAudioContext)();

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(880, audio.currentTime);
    osc.frequency.setValueAtTime(1175, audio.currentTime + 0.08);

    gain.gain.setValueAtTime(0.20, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.25);

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime + 0.25);

}



function reproducirSonidoError(){

    const audio = new (window.AudioContext || window.webkitAudioContext)();

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(250, audio.currentTime);

    gain.gain.setValueAtTime(0.20, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.40);

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime + 0.40);

}

/*
==================================================
FOTO DEL ALUMNO
==================================================
Al leer una tarjeta o QR, se pide la foto al servidor en paralelo
con el registro de asistencia. Solo se muestra cuando la asistencia
se registra con éxito, y se oculta al terminar el cooldown.
Si el alumno no tiene foto o no carga, todo sigue igual que antes.
*/

const fotoAlumno = document.getElementById("fotoAlumno");

let promesaFoto = null;
let idPromesaFoto = null;
let marcaFoto = 0;

function solicitarFoto(id){

    idPromesaFoto = id;

    promesaFoto = fetch(URL_SCRIPT,{

        method:"POST",

        headers:{ "Content-Type":"text/plain;charset=utf-8" },

        body:JSON.stringify({ accion:"fotoAlumno", idAlumno:id })

    })
    .then(r => r.json())
    .then(d => (d && d.success && d.foto) ? d.foto : null)
    .catch(() => null);

}

async function mostrarFotoAlumno(){

    const marca = ++marcaFoto;

    if(!promesaFoto) return;

    const fuente = await promesaFoto;

    // Solo se muestra si sigue vigente la misma pantalla de resultado
    if(fuente && marca === marcaFoto){

        fotoAlumno.src = fuente;
        fotoAlumno.style.display = "block";
                 document.body.classList.add("conFoto");

    }

}

/*
==================================================
MODO NFC: TOCAR EL ÍCONO APAGA LA CÁMARA TEMPORALMENTE
==================================================
El lector NFC se activa al cargar la página (antes que la cámara), por
lo que Chrome ya tiene el control. Al tocar el ícono NFC solo se apaga
la cámara, SIN reiniciar el lector NFC. La cámara se vuelve a encender
sola al terminar la lectura, o a los 20 segundos si nadie acerca una
tarjeta. Tocar el ícono otra vez cancela el modo NFC.
*/

// Abre y cierra enseguida una ventana en blanco. Esto hace que Chrome salga
// y vuelva al primer plano, lo que (en el Samsung A53) parece devolverle el
// control del NFC después de haber usado la cámara. Experimental.
function despertarChrome(){

    return new Promise(resolver => {

        try{

            const ventana = window.open("about:blank", "_blank");

            if(!ventana){
                resolver();
                return;
            }

            setTimeout(()=>{

                try{ ventana.close(); }catch(e){}

                setTimeout(resolver, 500);

            }, 700);

        }catch(e){

            resolver();

        }

    });

}

iconoNFC.style.cursor = "pointer";

iconoNFC.addEventListener("click", ()=>{

    if(bloqueado) return;

    // Segundo toque: cancelar y volver a la cámara
    if(camaraSuspendida){
        salirModoNFC();
        return;
    }

    camaraSuspendida = true;

    detenerCamara();

    estado.className = "espera";
    estado.innerHTML = "⏳ Preparando lector NFC...";

    despertarChrome().then(()=>{

        if(camaraSuspendida && !bloqueado){
            estado.className = "espera";
            estado.innerHTML = "📲 Acerca tu tarjeta ahora";
        }

    });

    clearTimeout(temporizadorNFC);
    temporizadorNFC = setTimeout(salirModoNFC, 8000);

});

async function salirModoNFC(){

    clearTimeout(temporizadorNFC);

    if(!camaraSuspendida) return;

    // Si hay una lectura en curso, la cámara se reactiva al terminar el cooldown
    if(bloqueado) return;

    camaraSuspendida = false;

    await iniciarQR();

    estado.className = "espera";
    estado.innerHTML = "Acerca tu tarjeta o muestra tu QR";

}

/*
==================================================
MENSAJE DE CUMPLEAÑOS
==================================================
Cuando el servidor indica que el alumno cumple años hoy, mañana o
cumplió ayer, se muestra un mensaje a pantalla completa durante
8 segundos (o hasta pulsar CONTINUAR) con una melodía festiva.
Después aparece la pantalla normal de asistencia registrada.
*/

const TEXTOS_CUMPLE = {
    HOY:    "FELICIDADES POR TU CUMPLEAÑOS",
    MANANA: "FELICIDADES POR TU CUMPLE DE MAÑANA",
    AYER:   "FELICIDADES POR TU CUMPLE DE AYER!"
};

let datosCumple = null;
let temporizadorCumple = null;
let audioCumple = null;

function mostrarCumple(datos){

    datosCumple = datos;

    document.getElementById("textoCumple").textContent =
        TEXTOS_CUMPLE[datos.cumple] || TEXTOS_CUMPLE.HOY;

    document.getElementById("overlayCumple").style.display = "flex";

    reproducirSonidoCumple();

    clearTimeout(temporizadorCumple);
    temporizadorCumple = setTimeout(cerrarCumple, 8000);

}

function cerrarCumple(){

    if(!datosCumple) return;

    clearTimeout(temporizadorCumple);

    document.getElementById("overlayCumple").style.display = "none";

    if(audioCumple){
        try{ audioCumple.close(); }catch(e){}
        audioCumple = null;
    }

    const datos = datosCumple;
    datosCumple = null;

    mostrarResultado(datos, true);

}

function reproducirSonidoCumple(){

    try{

        const audio = new (window.AudioContext || window.webkitAudioContext)();

        audioCumple = audio;

        if(audio.state === "suspended"){ audio.resume(); }

        // Fanfarria festiva: do-mi-sol-do agudo, repetida dos veces
        const frase = [
            [523.25, 0.14], [659.25, 0.14], [783.99, 0.14], [1046.50, 0.30],
            [783.99, 0.14], [1046.50, 0.14], [1318.51, 0.40]
        ];

        let t = audio.currentTime + 0.05;

        for(let repeticion = 0; repeticion < 2; repeticion++){

            for(const [frecuencia, duracion] of frase){

                const osc  = audio.createOscillator();
                const gain = audio.createGain();

                osc.type = "square";
                osc.frequency.setValueAtTime(frecuencia, t);

                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.exponentialRampToValueAtTime(0.30, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + duracion);

                osc.connect(gain);
                gain.connect(audio.destination);

                osc.start(t);
                osc.stop(t + duracion + 0.02);

                t += duracion + 0.03;

            }

            t += 0.25;

        }

    }catch(error){

        console.log("Sonido de cumpleaños no disponible:", error);

    }

}

/*
==================================================
RECONOCIMIENTO FACIAL (SOLO CON ?rostro=si)
==================================================
Modo de prueba. Si la dirección NO termina en ?rostro=si, este bloque
no hace nada y la página funciona exactamente igual que antes.

Con ?rostro=si:
 1. Se carga la biblioteca de reconocimiento facial y sus modelos.
 2. Se piden al servidor las fotos de los alumnos vigentes y se calcula
    una "huella" numérica de cada rostro. Las huellas viven solo en la
    memoria de la página: no se guardan en el teléfono ni se envían.
 3. La cámara frontal (la misma del QR) busca rostros. Cuando uno
    coincide claramente con un alumno, de forma estable, se registra su
    asistencia con el mismo proceso del QR y el NFC (procesarIDAlumno).
Añadiendo &debug=si se muestra en pantalla el ID más parecido y su
distancia, para ajustar los valores de abajo.
==================================================
*/

const PARAMS_ROSTRO = new URLSearchParams(window.location.search);
const MODO_ROSTRO   = PARAMS_ROSTRO.get("rostro") === "si";
const DEPURAR_ROSTRO = PARAMS_ROSTRO.get("debug") === "si";

// ---------- AJUSTES (puede modificarlos) ----------
// Distancia máxima para aceptar una coincidencia. Más baja = más estricto
// (menos errores, pero a veces no reconoce). Valores típicos: 0.45 a 0.60.
const ROSTRO_DISTANCIA_MAX = 0.50;
// El mejor candidato debe ser al menos esto más parecido que el segundo.
// Más alto = evita confundir hermanos o alumnos parecidos.
const ROSTRO_MARGEN_MIN = 0.07;
// Cuántas lecturas seguidas deben dar el mismo alumno antes de registrar.
const ROSTRO_CUADROS_CONFIRMAR = 1;
// Cada cuántos milisegundos se analiza la cámara.
const ROSTRO_INTERVALO_MS = 350;
// Tamaño mínimo del rostro (fracción del ancho de la imagen). Evita
// registrar a quien está lejos, en la fila.
const ROSTRO_TAMANO_MIN = 0.22;
// Tiempo (ms) durante el cual no se vuelve a registrar al mismo alumno
// por rostro, para que no vea "ya registró" si sigue frente a la cámara.
const ROSTRO_ESPERA_MISMO_ALUMNO_MS = 15000;
// Cuántas fotos se descargan al mismo tiempo al iniciar.
const ROSTRO_FOTOS_SIMULTANEAS = 3;

const FACEAPI_URL     = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js";
const FACEAPI_MODELOS = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model";
// --------------------------------------------------

const estadoRostro = document.getElementById("estadoRostro");

let baseRostros = [];          // [{id, nombre, descriptor}]
let rostrosSinHuella = [];     // alumnos que no se pudieron usar
let ocupadoRostro = false;
let candidatoRostro = null;
let aciertosRostro = 0;
const ultimoRegistroRostro = {};   // id -> momento del último registro por rostro

function mostrarEstadoRostro(texto){
    estadoRostro.style.display = "block";
    estadoRostro.textContent = texto;
}

function cargarScriptExterno(url){
    return new Promise((resolver, rechazar)=>{
        const tag = document.createElement("script");
        tag.src = url;
        tag.onload = resolver;
        tag.onerror = ()=> rechazar(new Error("No se pudo cargar " + url));
        document.head.appendChild(tag);
    });
}

function cargarImagenDesdeURL(fuente){
    return new Promise((resolver, rechazar)=>{
        const img = new Image();
        img.onload = ()=> resolver(img);
        img.onerror = ()=> rechazar(new Error("Imagen no válida"));
        img.src = fuente;
    });
}

// Las detecciones se hacen de una en una para no saturar al teléfono
let colaRostro = Promise.resolve();
function enSerieRostro(tarea){
    const p = colaRostro.then(tarea);
    colaRostro = p.catch(()=>{});
    return p;
}

function distanciaEuclidiana(a, b){
    let suma = 0;
    for(let i = 0; i < a.length; i++){
        const d = a[i] - b[i];
        suma += d * d;
    }
    return Math.sqrt(suma);
}

// Devuelve el alumno más parecido, su distancia y la del segundo más parecido
function mejorCoincidencia(descriptor, base){
    let mejor = null, d1 = Infinity, d2 = Infinity;
    for(const alumno of base){
        const d = distanciaEuclidiana(descriptor, alumno.descriptor);
        if(d < d1){ d2 = d1; d1 = d; mejor = alumno; }
        else if(d < d2){ d2 = d; }
    }
    return { alumno: mejor, distancia: d1, segunda: d2 };
}

function esCoincidenciaValida(r){
    return r.alumno !== null &&
           r.distancia <= ROSTRO_DISTANCIA_MAX &&
           (r.segunda - r.distancia) >= ROSTRO_MARGEN_MIN;
}

function reiniciarConfirmacionRostro(){
    candidatoRostro = null;
    aciertosRostro = 0;
}

async function pedirAlServidor(cuerpo){
    const respuesta = await fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(cuerpo)
    });
    return respuesta.json();
}

async function iniciarReconocimientoFacial(){

    etiquetaQR.textContent = "Mira a la cámara para registrar tu asistencia · o usa tu tarjeta / QR";
    mostrarEstadoRostro("Cargando reconocimiento facial...");

    try{

        await cargarScriptExterno(FACEAPI_URL);

        await faceapi.nets.tinyFaceDetector.loadFromUri(FACEAPI_MODELOS);
        await faceapi.nets.faceLandmark68TinyNet.loadFromUri(FACEAPI_MODELOS);
        await faceapi.nets.faceRecognitionNet.loadFromUri(FACEAPI_MODELOS);

        const lista = await pedirAlServidor({ accion: "listaRostros" });

        if(!lista || !lista.success || !lista.alumnos){
            throw new Error("No se pudo obtener la lista de alumnos");
        }

        const alumnos = lista.alumnos;
        let siguiente = 0, procesados = 0;

        mostrarEstadoRostro("Preparando rostros 0/" + alumnos.length);

        const trabajador = async ()=>{

            while(siguiente < alumnos.length){

                const alumno = alumnos[siguiente++];

                try{

                    const foto = await pedirAlServidor({ accion: "fotoAlumno", idAlumno: alumno.id });

                    if(foto && foto.success && foto.foto){

                        const img = await cargarImagenDesdeURL(foto.foto);

                        const det = await enSerieRostro(()=>
                            faceapi
                              .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 }))
                              .withFaceLandmarks(true)
                              .withFaceDescriptor()
                        );

                        if(det){
                            baseRostros.push({ id: alumno.id, nombre: alumno.nombre, descriptor: det.descriptor });
                        }else{
                            rostrosSinHuella.push(alumno.nombre + " (no se detectó rostro en la foto)");
                        }

                    }else{
                        rostrosSinHuella.push(alumno.nombre + " (sin foto en Drive)");
                    }

                }catch(error){
                    console.log("Rostro no preparado:", alumno.id, error);
                    rostrosSinHuella.push(alumno.nombre + " (error al preparar)");
                }

                procesados++;
                mostrarEstadoRostro("Preparando rostros " + procesados + "/" + alumnos.length);

            }

        };

        await Promise.all(Array.from({ length: ROSTRO_FOTOS_SIMULTANEAS }, trabajador));

        let resumen = "Reconocimiento facial activo · " + baseRostros.length + " alumnos";

        if(rostrosSinHuella.length > 0){
            resumen += " · " + rostrosSinHuella.length + " sin rostro (toca para ver)";
        }

        mostrarEstadoRostro(resumen);

        // Al tocar el texto se alterna entre el resumen y la lista de alumnos sin rostro
        let verLista = false;
        estadoRostro.onclick = ()=>{
            verLista = !verLista;
            estadoRostro.textContent = (verLista && rostrosSinHuella.length)
                ? "Sin rostro: " + rostrosSinHuella.join(" · ")
                : resumen;
        };

        if(rostrosSinHuella.length === 0 && !DEPURAR_ROSTRO){
            setTimeout(()=>{ estadoRostro.style.display = "none"; }, 6000);
        }

        cicloRostro();

    }catch(error){

        console.error("Reconocimiento facial no disponible:", error);
        mostrarEstadoRostro("Reconocimiento facial no disponible (el QR y el NFC siguen funcionando)");

    }

}

async function analizarCuadroRostro(){

    const opciones = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });

    // Paso 1 (rápido): ¿hay algún rostro lo bastante grande?
    const caras = await faceapi.detectAllFaces(videoQR, opciones);

    if(caras.length === 0){ reiniciarConfirmacionRostro(); return; }

    const mayor = caras.reduce((a, b)=> (b.box.width > a.box.width ? b : a));

    if(mayor.box.width / videoQR.videoWidth < ROSTRO_TAMANO_MIN){
        reiniciarConfirmacionRostro();
        return;
    }

    // Paso 2: huella del rostro más grande
    const completas = await faceapi
        .detectAllFaces(videoQR, opciones)
        .withFaceLandmarks(true)
        .withFaceDescriptors();

    if(completas.length === 0){ reiniciarConfirmacionRostro(); return; }

    const principal = completas.reduce((a, b)=> (b.detection.box.width > a.detection.box.width ? b : a));

    const resultado = mejorCoincidencia(principal.descriptor, baseRostros);

    if(DEPURAR_ROSTRO){
        mostrarEstadoRostro(
            "ID más parecido: " + (resultado.alumno ? resultado.alumno.id : "-") +
            " · distancia " + resultado.distancia.toFixed(2) +
            " · segundo " + (isFinite(resultado.segunda) ? resultado.segunda.toFixed(2) : "-")
        );
    }

    if(!esCoincidenciaValida(resultado)){ reiniciarConfirmacionRostro(); return; }

    if(candidatoRostro === resultado.alumno.id){
        aciertosRostro++;
    }else{
        candidatoRostro = resultado.alumno.id;
        aciertosRostro = 1;
    }

    if(aciertosRostro < ROSTRO_CUADROS_CONFIRMAR) return;

    // Se vuelve a revisar: durante el análisis pudo leerse una tarjeta o QR
    if(bloqueado) return;

    const id = resultado.alumno.id;
    const ahora = Date.now();

    reiniciarConfirmacionRostro();

    // Ya se registró hace poco: no se repite mientras siga frente a la cámara
    if(ahora - (ultimoRegistroRostro[id] || 0) < ROSTRO_ESPERA_MISMO_ALUMNO_MS) return;

    ultimoRegistroRostro[id] = ahora;

    bloqueado = true;

    reproducirSonidoDeteccion();

    procesarIDAlumno(id, false);

}

async function cicloRostro(){

    try{

        if(escaneando && !bloqueado && !ocupadoRostro &&
           videoQR.readyState >= 2 && videoQR.videoWidth > 0 && baseRostros.length > 0){

            ocupadoRostro = true;

            await analizarCuadroRostro();

        }

    }catch(error){

        console.log("Error al analizar el rostro:", error);

    }

    ocupadoRostro = false;

    setTimeout(cicloRostro, ROSTRO_INTERVALO_MS);

}

if(MODO_ROSTRO){
    iniciarReconocimientoFacial();
}
